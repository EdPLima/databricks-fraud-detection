# ============================================================================
# Configuracao central do projeto
# ============================================================================

project:
  name: databricks-fraud-detection
  root: "/Workspace/Users/eduardolimaofficial410@gmail.com/databricks-fraud-detection"

catalog: fraud_detection_dev

feature_store:
  table: fraud_detection_dev.gold.fraud_features
  split_column: split
  train_value: train
  val_value: val
  test_value: test
  split_methodology: temporal  # walk-forward, nao aleatorio

experiments:
  # Relative paths resolved by load_config() using project root
  hpo: experiments/fraud_detection_walkforward
  deploy: experiments/fraud_detection_deployment

model:
  registered_name: models.lgbm_fraud_model  # resolved with catalog prefix by load_config()
  optimal_threshold: 0.83
  max_bins: 1500
  seed: 42

preprocessing:
  exclude_cols:
    - TransactionID
    - TransactionDT
    - target
    - class_weight
  imputer_strategy: median
  handle_invalid: keep

# Colunas que nao sao features (identificadores, timestamps)
non_feature_cols:
  - TransactionID
  - TransactionDT