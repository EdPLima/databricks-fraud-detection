[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-fraud-detection"
version = "0.1.0"
description = "Pipeline ML para detecção de fraude em transações financeiras"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Eduardo Lima", email = "eduardolimaofficial410@gmail.com"}
]

dependencies = [
    # ML Core (versões pinadas para reprodutibilidade do modelo)
    "scikit-learn==1.6.1",
    "xgboost",
    "cloudpickle==3.1.1",
    
    # Data manipulation
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Databricks
    "mlflow==3.8.1",
    "databricks-feature-engineering>=0.2.0",
    "databricks-sdk>=0.20.0",
    
    # Hyperparameter tuning
    "optuna>=3.5.0",
    
    # Model interpretation
    "shap>=0.44.0",
    
    # Config management
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",

    # Code quality
    "ruff>=0.1.0",
    "mypy>=1.7.0",

    # Notebooks
    "ipykernel>=6.25.0",

    # Spark (needed for imports in feature_engineering.py during CI)
    "pyspark>=3.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (require Databricks workspace, endpoint, and tables)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N812"]  # E501: line too long, N812: `functions as F` is PySpark convention

[tool.ruff.lint.per-file-ignores]
"tests/integration/*" = ["F821"]  # `spark` is a pytest fixture from conftest.py

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true