resources:
  alerts:
    # Alerta 1: Retraining atrasado (modelo nao retreinado no dia 10)
    retraining_overdue:
      display_name: "[${bundle.target}] Retraining Atrasado"
      query_text: |
        SELECT COALESCE(
          DATEDIFF(
            CURRENT_DATE(),
            (SELECT MAX(r.period_end_time)
             FROM system.lakeflow.job_run_timeline r
             JOIN system.lakeflow.jobs j ON r.job_id = j.job_id
             WHERE j.name LIKE '%Retraining%'
               AND r.result_state = 'SUCCEEDED'
               AND r.run_type = 'WORKFLOW_RUN')
          ),
          999
        ) AS days_since_last_retraining
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: days_since_last_retraining
          display: days_since_last_retraining
        threshold:
          value:
            double_value: 35
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 0 9 11 * ?"
        timezone_id: America/Sao_Paulo

    # Alerta 2: Taxa de fraude elevada nas predicoes
    high_fraud_rate:
      display_name: "[${bundle.target}] Taxa de Fraude Elevada"
      query_text: |
        SELECT
          COALESCE(
            (SELECT AVG(CAST(is_fraud AS DOUBLE)) * 100
             FROM ${var.catalog}.gold.model_predictions
             WHERE prediction_timestamp >= DATE_SUB(CURRENT_DATE(), 1)),
            0
          ) AS fraud_rate_pct
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: fraud_rate_pct
          display: fraud_rate_pct
        threshold:
          value:
            double_value: 5.0
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 0 10 * * ?"
        timezone_id: America/Sao_Paulo

    # Alerta 3: Sem eventos de monitoramento (pipeline parado)
    monitoring_stale:
      display_name: "[${bundle.target}] Sem Eventos de Monitoramento"
      query_text: |
        SELECT
          COALESCE(
            DATEDIFF(
              CURRENT_DATE(),
              (SELECT MAX(event_timestamp)
               FROM ${var.catalog}.bronze.monitoring_raw_events)
            ),
            999
          ) AS days_since_last_monitoring
      warehouse_id: ${var.warehouse_id}
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: days_since_last_monitoring
          display: days_since_last_monitoring
        threshold:
          value:
            double_value: 2
        notification:
          notify_on_ok: false
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        pause_status: UNPAUSED
        quartz_cron_schedule: "0 0 11 * * ?"
        timezone_id: America/Sao_Paulo